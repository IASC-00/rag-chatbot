# Ruff config for rag-chatbot.
#
# Added so the security lint (--select S) can run on this repo in the pre-commit
# gate. The only carve-out is S101 in tests: `assert` IS the pytest idiom, and
# flagging it there is noise that would push people toward --no-verify, which
# costs far more than it saves. Application code keeps the full S ruleset.

line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "S", "B", "UP"]

[lint.per-file-ignores]
"tests/*" = ["S101"]   # assert is the point of a test
"eval/*" = ["S101"]
