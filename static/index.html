<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask your documents · iswain.dev demo</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --accent: #00ff88;
            --text: #e0e0e0;
            --panel: #1a1a1a;
            --font: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 1.5rem;
            border-bottom: 1px solid #333;
            text-align: center;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--accent);
            letter-spacing: 0.05em;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem;
            border-radius: 8px;
            line-height: 1.5;
            position: relative;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--panel);
            border-right: 3px solid var(--accent);
        }

        .assistant-message {
            align-self: flex-start;
            background-color: #222;
            border-left: 3px solid #666;
        }

        .sources {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .source-pill {
            font-size: 0.7rem;
            background-color: #333;
            color: #888;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            border: 1px solid #444;
        }

        #input-container {
            padding: 1.5rem 2rem;
            border-top: 1px solid #333;
            background-color: var(--bg);
            display: flex;
            gap: 1rem;
        }

        input {
            flex: 1;
            background-color: var(--panel);
            border: 1px solid #333;
            color: var(--text);
            padding: 0.8rem 1rem;
            border-radius: 4px;
            font-family: inherit;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: var(--bg);
            border: none;
            padding: 0 1.5rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        button:disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
        }

        .loading {
            color: var(--accent);
            font-size: 0.9rem;
            font-style: italic;
            margin-bottom: 1rem;
            display: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
        }
        .examples { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.9rem; }
        .example {
            background: transparent; color: inherit; border: 1px solid #444; border-radius: 4px;
            padding: 0.45rem 0.7rem; font: inherit; font-size: 0.85em; cursor: pointer; text-align: left;
        }
        .example:hover, .example:focus-visible { border-color: var(--accent); outline: none; }
        .back { margin-top: 0.9rem; font-size: 0.8em; opacity: 0.7; }
        .back a { color: inherit; }
        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <header>
        <h1>ASK YOUR DOCUMENTS</h1>
    </header>

    <main id="chat-container">
        <div class="message assistant-message">
            I only answer from three documents for a made-up bakery: a staff handbook, its customer
            policies, and an opening and closing checklist. If the answer isn't in them, I'll say so.
            Ask me something, or try one of these:
            <div class="examples">
                <button type="button" class="example">How much notice do custom cakes need?</button>
                <button type="button" class="example">What do I do if I'm sick?</button>
                <button type="button" class="example">What temperature should the fridges be?</button>
                <button type="button" class="example">Can I get a refund on a cake I already picked up?</button>
            </div>
            <div class="back">A demo by <a href="https://iswain.dev/?ref=rag-demo">iswain.dev</a></div>
        </div>
    </main>

    <div style="padding: 0 2rem;">
        <div id="loading" class="loading">thinking...</div>
    </div>

    <form id="input-container">
        <input type="text" id="query-input" placeholder="Type your question..." autocomplete="off">
        <button type="submit" id="send-btn">SEND</button>
    </form>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const queryInput = document.getElementById('query-input');
        const sendBtn = document.getElementById('send-btn');
        const loading = document.getElementById('loading');
        const chatForm = document.getElementById('input-container');

        function appendMessage(role, text, sources = []) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}-message`;
            msgDiv.textContent = text;

            if (sources && sources.length > 0) {
                const sourcesDiv = document.createElement('div');
                sourcesDiv.className = 'sources';
                sources.forEach(src => {
                    const pill = document.createElement('span');
                    pill.className = 'source-pill';
                    pill.textContent = src;
                    sourcesDiv.appendChild(pill);
                });
                msgDiv.appendChild(sourcesDiv);
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        document.querySelectorAll('.example').forEach(btn => btn.addEventListener('click', () => {
            if (queryInput.disabled) return;
            queryInput.value = btn.textContent;
            chatForm.requestSubmit();
        }));

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = queryInput.value.trim();
            if (!query) return;

            // Disable UI
            queryInput.value = '';
            queryInput.disabled = true;
            sendBtn.disabled = true;
            loading.style.display = 'block';

            // User message
            appendMessage('user', query);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const data = await response.json();

                if (data.error) {
                    appendMessage('assistant', `Error: ${data.error}`);
                } else {
                    appendMessage('assistant', data.response.answer, data.response.sources);
                }
            } catch (err) {
                appendMessage('assistant', `System Error: ${err.message}`);
            } finally {
                // Re-enable UI
                queryInput.disabled = false;
                sendBtn.disabled = false;
                loading.style.display = 'none';
                queryInput.focus();
            }
        });
    </script>
</body>
</html>
